name: Build Prompt Forge Beta APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o PromptForge-Mobile-Beta-b3.zip
          echo "Android project extracted"
          ls -la PromptForgeBetaAndroid

      - name: Patch Beta WebView debugging
        run: |
          sed -i 's/WebView.setWebContentsDebuggingEnabled(BuildConfig.DEBUG);/WebView.setWebContentsDebuggingEnabled(true);/' \
            PromptForgeBetaAndroid/app/src/main/java/com/promptforge/beta/MainActivity.java

          grep -n "setWebContentsDebuggingEnabled" \
            PromptForgeBetaAndroid/app/src/main/java/com/promptforge/beta/MainActivity.java
            
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"

          echo "Using sdkmanager at: $SDKMANAGER"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found"
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager -print
            exit 1
          fi

          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Prompt Forge APK
        working-directory: PromptForgeBetaAndroid
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          ls -lh PromptForgeBetaAndroid/app/build/outputs/apk/debug/
          test -f PromptForgeBetaAndroid/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: |
          cp PromptForgeBetaAndroid/app/build/outputs/apk/debug/app-debug.apk \
             PromptForge-Beta-1.0.0-b3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PromptForge-Beta-1.0.0-b3
          path: PromptForge-Beta-1.0.0-b3.apk
          if-no-files-found: error
