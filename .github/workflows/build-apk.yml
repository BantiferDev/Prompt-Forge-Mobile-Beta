name: Build Prompt Forge Beta APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip PromptForge-Mobile-Beta-b1.zip
          echo "Root contents:"
          ls -la
          echo "Project contents:"
          ls -la PromptForgeBetaAndroid

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: PromptForgeBetaAndroid
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          cp PromptForgeBetaAndroid/app/build/outputs/apk/debug/app-debug.apk \
             PromptForge-Beta-1.0.0-b1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptForge-Beta-1.0.0-b1
          path: PromptForge-Beta-1.0.0-b1.apk
